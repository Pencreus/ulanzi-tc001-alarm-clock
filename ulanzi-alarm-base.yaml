# Ulanzi TC001 -> alarm clock. Shared config; per-device files set substitutions.
# Stock features kept: clock, date, indoor temp/humidity, outdoor weather (via HA),
# ambient-light auto brightness, 3 buttons. Added: weekday/weekend alarm with web UI.

substitutions:
  # defaults; override any of these in your device file
  timezone: America/Los_Angeles
  weather_entity: weather.home                  # Home Assistant weather entity (condition text)
  outdoor_temp_entity: sensor.outdoor_temperature  # Home Assistant outdoor temperature (deg F)
  wk_alarm_time: "07:10:00"   # Mon-Fri default wake time
  we_alarm_time: "09:00:00"   # Sat-Sun default wake time
  temp_offset_c: "0.0"
  ldr_dark_v: "0.7"
  ldr_bright_v: "2.6"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - clockui.h
  on_boot:
    priority: -100
    then:
      - ds1307.read_time:

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
  - platform: web_server   # lets you upload any .bin from the clock's web page (rescue path)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}-setup
    password: !secret ap_password

captive_portal:

# Schedule editing page (also reachable from HA). Local = JS served from the clock.
web_server:
  port: 80
  version: 3
  local: true

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - time.cloudflare.com
      - time.google.com
      - 0.pool.ntp.org
    on_time_sync:
      - ds1307.write_time:
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return;
              if (clockui::alarm_due(now, id(sw_weekday).state, id(wk_alarm).hour, id(wk_alarm).minute,
                                     id(sw_weekend).state, id(we_alarm).hour, id(we_alarm).minute))
                id(alarm_ring).execute();
  - platform: ds1307
    id: ds1307_time
    update_interval: never

globals:
  - id: page
    type: int
    initial_value: "0"
  - id: page_start
    type: uint32_t
    initial_value: "0"
  - id: hold_until
    type: uint32_t
    initial_value: "0"
  - id: valid_mask
    type: int
    initial_value: "7"
  - id: screen_on
    type: bool
    initial_value: "true"
  - id: bright_mode
    type: int
    initial_value: "0"
  - id: cur_bright
    type: float
    initial_value: "0.3"
  - id: alarm_ringing
    type: bool
    initial_value: "false"
  - id: ring_start
    type: uint32_t
    initial_value: "0"
  - id: dismissed_ms
    type: uint32_t
    initial_value: "0"
  - id: anim_id
    type: int
    initial_value: "0"

# ---------------------------------------------------------------- alarm settings
switch:
  - platform: template
    id: sw_weekday
    name: "Alarm Mon-Fri"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sw_weekend
    name: "Alarm Sat-Sun"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

datetime:
  - platform: template
    id: wk_alarm
    name: "Mon-Fri Wake Time"
    type: time
    optimistic: true
    initial_value: "${wk_alarm_time}"
    restore_value: true
  - platform: template
    id: we_alarm
    name: "Sat-Sun Wake Time"
    type: time
    optimistic: true
    initial_value: "${we_alarm_time}"
    restore_value: true

button:
  - platform: template
    name: "Test Alarm"
    on_press:
      - script.execute: alarm_ring
  - platform: template
    name: "Dismiss Alarm"
    on_press:
      - script.execute: dismiss_alarm

text_sensor:
  - platform: template
    name: "Next Alarm"
    id: next_alarm
    update_interval: 30s
    lambda: |-
      auto now = id(sntp_time).now();
      if (!now.is_valid()) return {"time not synced"};
      std::string s;
      if (clockui::next_alarm_text(now, id(sw_weekday).state, id(wk_alarm).hour, id(wk_alarm).minute,
                                   id(sw_weekend).state, id(we_alarm).hour, id(we_alarm).minute, s))
        return s;
      return {"none armed"};
  # outdoor weather condition from Home Assistant
  - platform: homeassistant
    id: out_cond
    entity_id: ${weather_entity}
    internal: true

# ---------------------------------------------------------------- ringing
output:
  - platform: ledc
    id: buzzer_out
    pin: GPIO15

# A square wave at 50% duty is the loudest this passive buzzer can be, so loudness
# is tuned with the pitch (closest to the buzzer's resonance) and longer beeps.
number:
  - platform: template
    id: alarm_pitch
    name: "Alarm Pitch (Hz)"
    min_value: 1000
    max_value: 5000
    step: 100
    initial_value: 3100
    restore_value: true
    optimistic: true

select:
  - platform: template
    id: anim_sel
    name: "Animations"
    options: ["Random", "Matrix Rain", "Rain", "Rainbow", "Plasma", "Fire", "Scroller", "Off"]
    initial_option: "Random"
    optimistic: true
    restore_value: true

script:
  - id: alarm_ring
    mode: single
    then:
      - lambda: |-
          id(alarm_ringing) = true;
          id(ring_start) = millis();
      - while:
          condition:
            lambda: 'return id(alarm_ringing) && (millis() - id(ring_start) < 1800000UL);'
          then:
            # each beep sweeps the pitch (-1000..+1200 Hz around the setting) so it always
            # crosses the buzzer's loudest resonance, wherever that sits
            # 48 steps = 4 beeps x 12 pitch steps of 25 ms; 90 ms gap after each beep
            - repeat:
                count: 48
                then:
                  - if:
                      condition:
                        lambda: 'return id(alarm_ringing);'
                      then:
                        - output.ledc.set_frequency:
                            id: buzzer_out
                            frequency: !lambda 'return std::max(300.0f, id(alarm_pitch).state - 2500 + (iteration % 12) * 400);'
                        - output.set_level:
                            id: buzzer_out
                            level: 50%
                  - delay: 25ms
                  - if:
                      condition:
                        lambda: 'return iteration % 12 == 11;'
                      then:
                        - output.set_level:
                            id: buzzer_out
                            level: 0%
                        - delay: 90ms
            - delay: 500ms
      - lambda: id(alarm_ringing) = false;
      - output.set_level:
          id: buzzer_out
          level: 0%
  - id: dismiss_alarm
    then:
      - lambda: |-
          id(alarm_ringing) = false;
          id(dismissed_ms) = millis();
      - output.set_level:
          id: buzzer_out
          level: 0%
  - id: change_page
    parameters:
      dir: int
    then:
      - lambda: |-
          id(page) = clockui::next_page(id(page), dir, id(valid_mask), 6);
          id(page_start) = millis();
          if (id(page) == 5) {
            std::string sel = id(anim_sel).current_option();
            if (sel == "Matrix Rain") id(anim_id) = 0;
            else if (sel == "Rain") id(anim_id) = 1;
            else if (sel == "Rainbow") id(anim_id) = 2;
            else if (sel == "Plasma") id(anim_id) = 3;
            else if (sel == "Fire") id(anim_id) = 4;
            else if (sel == "Scroller") id(anim_id) = 5;
            else id(anim_id) = (int) (random_float() * 6.0f) % 6;
          }
          id(hold_until) = millis() + 20000;

# ---------------------------------------------------------------- sensors
sensor:
  - platform: sht3xd
    address: 0x44
    update_interval: 30s
    temperature:
      id: in_temp
      name: "Temperature"
      filters:
        - offset: ${temp_offset_c}
    humidity:
      id: in_hum
      name: "Humidity"
  # ambient light (LDR). Calibrate ldr_dark_v / ldr_bright_v after flashing.
  - platform: adc
    id: ldr_v
    pin: GPIO35
    name: "Ambient Light (volts)"
    attenuation: 12db
    update_interval: 1s
    filters:
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
  - platform: adc
    id: batt_v
    pin: GPIO34
    name: "Battery ADC (volts)"
    attenuation: 12db
    update_interval: 60s
  - platform: homeassistant
    id: out_temp
    name: "Outdoor Temperature (from HA)"
    entity_id: ${outdoor_temp_entity}

# ---------------------------------------------------------------- buttons
binary_sensor:
  - platform: gpio
    id: btn_left
    pin: {number: GPIO26, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on: 25ms
    on_press:
      - if:
          condition:
            lambda: 'return id(alarm_ringing);'
          then:
            - script.execute: dismiss_alarm
    on_click:
      min_length: 25ms
      max_length: 1s
      then:
        - if:
            condition:
              lambda: 'return millis() - id(dismissed_ms) > 1500;'
            then:
              - script.execute:
                  id: change_page
                  dir: -1
  - platform: gpio
    id: btn_right
    pin: {number: GPIO14, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on: 25ms
    on_press:
      - if:
          condition:
            lambda: 'return id(alarm_ringing);'
          then:
            - script.execute: dismiss_alarm
    on_click:
      min_length: 25ms
      max_length: 1s
      then:
        - if:
            condition:
              lambda: 'return millis() - id(dismissed_ms) > 1500;'
            then:
              - script.execute:
                  id: change_page
                  dir: 1
  # middle: tap = display on/off, hold 1s = cycle brightness (auto/low/med/high)
  - platform: gpio
    id: btn_mid
    pin: {number: GPIO27, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on: 25ms
    on_press:
      - if:
          condition:
            lambda: 'return id(alarm_ringing);'
          then:
            - script.execute: dismiss_alarm
    on_click:
      - min_length: 25ms
        max_length: 800ms
        then:
          - lambda: |-
              if (millis() - id(dismissed_ms) > 1500) id(screen_on) = !id(screen_on);
      - min_length: 800ms
        max_length: 5s
        then:
          - lambda: |-
              if (millis() - id(dismissed_ms) > 1500) id(bright_mode) = (id(bright_mode) + 1) % 4;

# ---------------------------------------------------------------- display
light:
  - platform: esp32_rmt_led_strip
    id: led_matrix
    pin: GPIO32
    num_leds: 256
    rgb_order: GRB
    chipset: WS2812
    default_transition_length: 0s
    color_correct: [30%, 30%, 30%]   # caps LED current; matches the proven TC001 configs
    gamma_correct: 2.0
    restore_mode: ALWAYS_ON
    internal: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          // which pages can be shown: 0 time, 1 date, 2 indoor, 3 outdoor, 4 next alarm
          int mask = 0b00111;
          if (!std::isnan(id(out_temp).state)) mask |= (1 << 3);
          auto now = id(sntp_time).now();
          std::string s;
          if (now.is_valid() && clockui::next_alarm_text(now, id(sw_weekday).state, id(wk_alarm).hour,
              id(wk_alarm).minute, id(sw_weekend).state, id(we_alarm).hour, id(we_alarm).minute, s))
            mask |= (1 << 4);
          if (id(anim_sel).current_option() != "Off") mask |= (1 << 5);
          id(valid_mask) = mask;
          if (!(mask & (1 << id(page)))) id(page) = 0;

          // brightness
          float b;
          if (id(alarm_ringing)) {
            b = 0.7f;
          } else if (id(bright_mode) == 1) {
            b = 0.28f;
          } else if (id(bright_mode) == 2) {
            b = 0.45f;
          } else if (id(bright_mode) == 3) {
            b = 0.70f;
          } else {
            float v = id(ldr_v).state;
            if (std::isnan(v)) {
              b = 0.3f;
            } else {
              float t = (v - ${ldr_dark_v}) / (${ldr_bright_v} - ${ldr_dark_v});
              t = std::max(0.0f, std::min(1.0f, t));
              b = 0.26f + 0.34f * t;   // floor keeps the LEDs visible after gamma + 30% colour correction
            }
          }
          if (fabsf(b - id(cur_bright)) > 0.015f) {
            id(cur_bright) = b;
            auto call = id(led_matrix).turn_on();
            call.set_brightness(b);
            call.set_transition_length(0);
            call.perform();
          }

display:
  - platform: addressable_light
    id: matrix
    addressable_light_id: led_matrix
    width: 32
    height: 8
    update_interval: 100ms
    pixel_mapper: |-
      if (y % 2 == 0) {
        return (y * 32) + x;
      }
      return (y * 32) + (31 - x);
    lambda: |-
      using namespace clockui;
      auto now = id(sntp_time).now();

      // ---- alarm ringing: flash
      if (id(alarm_ringing)) {
        bool a = (millis() / 500) % 2;
        Color c = a ? Color(255, 40, 0) : Color(255, 200, 0);
        draw_text_centered(it, 1, "WAKE UP", c);
        for (int x = 0; x < 32; x += 2) {
          it.draw_pixel_at(x + (a ? 0 : 1), 0, c);
          it.draw_pixel_at(x + (a ? 1 : 0), 7, c);
        }
        return;
      }
      if (!id(screen_on)) return;

      // ---- page cycling (time stays up longest; buttons hold the page for 20 s)
      static const uint32_t DWELL[6] = {45000, 4000, 4000, 4000, 4000, 12000};
      if (millis() > id(hold_until) && millis() - id(page_start) > DWELL[id(page)]) {
        id(page) = next_page(id(page), 1, id(valid_mask), 6);
        id(page_start) = millis();
        if (id(page) == 5) {  // entering the animation page: choose which one
          std::string sel = id(anim_sel).current_option();
          if (sel == "Matrix Rain") id(anim_id) = 0;
          else if (sel == "Rain") id(anim_id) = 1;
          else if (sel == "Rainbow") id(anim_id) = 2;
          else if (sel == "Plasma") id(anim_id) = 3;
          else if (sel == "Fire") id(anim_id) = 4;
          else if (sel == "Scroller") id(anim_id) = 5;
          else id(anim_id) = (int) (random_float() * 6.0f) % 6;
        }
      }

      switch (id(page)) {
        case 0: {  // time
          if (!now.is_valid()) {
            draw_text_centered(it, 1, "SYNC", Color(120, 120, 120));
            break;
          }
          // Familiar TC001 layout: calendar card (day of month) + 3x5 time + weekday bars
          int h12 = now.hour % 12 == 0 ? 12 : now.hour % 12;
          Color white(255, 255, 255), red(220, 30, 30), black(0, 0, 0);
          it.filled_rectangle(0, 0, 9, 8, white);
          it.filled_rectangle(0, 0, 9, 2, red);
          std::string dom = std::to_string(now.day_of_month);
          draw_text(it, (9 - text_width(dom)) / 2, 3, dom, black);
          // large 4x7 time to the right of the card
          int nh = h12 >= 10 ? 2 : 1;
          int hw = nh * 4 + (nh - 1);
          int x = 10 + (22 - (hw + 3 + 9)) / 2;
          if (nh == 2) draw_big_digit(it, x, 1, h12 / 10, white);
          draw_big_digit(it, x + (nh == 2 ? 5 : 0), 1, h12 % 10, white);
          if (now.second % 2 == 0) {  // blinking colon
            it.draw_pixel_at(x + hw + 1, 3, white);
            it.draw_pixel_at(x + hw + 1, 5, white);
          }
          draw_big_digit(it, x + hw + 3, 1, now.minute / 10, white);
          draw_big_digit(it, x + hw + 8, 1, now.minute % 10, white);
          if (now.hour >= 12) it.draw_pixel_at(31, 0, Color(60, 60, 255));  // PM marker (blue dot)
          break;
        }
        case 1: {  // date
          if (!now.is_valid()) break;
          std::string dow = DOW3[now.day_of_week - 1];
          std::string dom = std::to_string(now.day_of_month);
          int w = text_width(dow) + 4 + text_width(dom);
          int x = (32 - w) / 2;
          draw_text(it, x, 1, dow, Color(0, 200, 255));
          draw_text(it, x + text_width(dow) + 4, 1, dom, Color(255, 255, 255));
          break;
        }
        case 2: {  // indoor temp + humidity
          float t = id(in_temp).state;
          float h = id(in_hum).state;
          std::string ts = std::isnan(t) ? std::string("--") : std::to_string((int) roundf(t * 1.8f + 32.0f));
          std::string hs = std::isnan(h) ? std::string("--") : std::to_string((int) roundf(h));
          int w = text_width(ts + "F") + 4 + text_width(hs + "%");
          int x = (32 - w) / 2;
          draw_text(it, x, 1, ts + "F", Color(255, 120, 60));
          draw_text(it, x + text_width(ts + "F") + 4, 1, hs + "%", Color(60, 140, 255));
          break;
        }
        case 3: {  // outdoor
          float t = id(out_temp).state;
          if (std::isnan(t)) break;
          std::string ts = std::to_string((int) roundf(t)) + "F";
          std::string cs = id(out_cond).state;
          std::string c = "";
          if (cs == "sunny") c = "SUN";
          else if (cs == "clear-night") c = "CLR";
          else if (cs == "partlycloudy") c = "PCLD";
          else if (cs == "cloudy") c = "CLD";
          else if (cs == "rainy") c = "RAIN";
          else if (cs == "pouring") c = "POUR";
          else if (cs == "snowy" || cs == "snowy-rainy") c = "SNOW";
          else if (cs == "fog") c = "FOG";
          else if (cs == "lightning" || cs == "lightning-rainy") c = "STRM";
          else if (cs == "windy" || cs == "windy-variant") c = "WIND";
          else if (cs == "hail") c = "HAIL";
          int w = text_width(ts) + (c.empty() ? 0 : 4 + text_width(c));
          if (w > 32) c = "";
          w = text_width(ts) + (c.empty() ? 0 : 4 + text_width(c));
          int x = (32 - w) / 2;
          draw_text(it, x, 1, ts, Color(255, 170, 0));
          if (!c.empty()) draw_text(it, x + text_width(ts) + 4, 1, c, Color(200, 200, 200));
          break;
        }
        case 4: {  // next alarm
          std::string s;
          if (now.is_valid() && next_alarm_text(now, id(sw_weekday).state, id(wk_alarm).hour, id(wk_alarm).minute,
                                                id(sw_weekend).state, id(we_alarm).hour, id(we_alarm).minute, s))
          {
            std::string t = s.substr(4);  // "7:10" (drop the day name)
            int aw = 5 + 3 + text_width(t);
            int ax = (32 - aw) / 2;
            draw_bell(it, ax, 0, Color(255, 170, 0));
            draw_text(it, ax + 8, 1, t, Color(255, 255, 255));
          }
          break;
        }
        case 5: {  // animations
          switch (id(anim_id)) {
            case 0: draw_streaks(it, true); break;
            case 1: draw_streaks(it, false); break;
            case 2: draw_rainbow(it); break;
            case 3: draw_plasma(it); break;
            case 4: draw_fire(it); break;
            default: {
              std::string msg = now.is_valid() ? now.strftime("%A %B %d") : std::string("HELLO");
              for (auto &ch : msg) ch = toupper(ch);
              draw_scroller(it, msg);
            }
          }
          break;
        }
      }
